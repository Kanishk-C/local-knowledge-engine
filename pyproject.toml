[project]
name = "lke"
version = "0.1.0"
description = "Local-first journal and knowledge base for Markdown vaults, with optional local AI search."
readme = "README.md"
authors = [
    { name = "Kanishk-C", email = "kanishkc01@gmail.com" }
]
requires-python = ">=3.14"
# Core: journal commands only (today, log, find, who, day, onthisday, links).
dependencies = [
    "loguru",
    "pydantic",
    "pyyaml>=6.0.3",
    "rich",
    "typer",
]

[project.optional-dependencies]
# Semantic search, RAG, enrichment and watch mode (needs a running Ollama).
ai = [
    "lancedb",
    "ollama",
    "sentence-transformers",
    "watchdog",
]
# REST API server (`lke serve`).
api = [
    "lke[ai]",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
lke = "lke.cli.app:run"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lke[ai,api]",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src --cov-report=term-missing --import-mode=importlib"
testpaths = ["tests"]
filterwarnings = [
    "ignore:table_names\\(\\) is deprecated:DeprecationWarning",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
